[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptproof"
version = "0.1.0"
description = "Snapshot & regression testing for LLM prompts — YAML test suites, CI-friendly assertions, any OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Dylan XM" },
]
keywords = ["llm", "prompt", "testing", "regression", "evaluation", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
promptproof = "promptproof.cli:main"

[project.urls]
Homepage = "https://github.com/dylanXM/promptproof"
Repository = "https://github.com/dylanXM/promptproof"
Issues = "https://github.com/dylanXM/promptproof/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
