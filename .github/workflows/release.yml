name: Release

# Builds the sdist + wheel on every v* tag push, validates them with
# `twine check --strict`, uploads them as a workflow artifact, and publishes
# to PyPI via trusted publishing (OIDC, no stored token). The publish job
# requires the `pypi` environment plus a PyPI trusted publisher configured
# for dylanXM/promptproof (see RELEASE.md); until that one-time setup is
# done, the build/validate jobs still run and prove the package is healthy.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          promptproof --version
          promptproof run examples/basic.yaml --mock

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/promptproof/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
