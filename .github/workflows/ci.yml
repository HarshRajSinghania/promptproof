name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Unit tests
        run: pytest -q

      - name: Offline demo suite (mock provider)
        run: |
          promptproof --version
          promptproof run examples/basic.yaml --mock --json report.json
          promptproof run examples/headlines.yaml --mock
          promptproof run examples/budgets.yaml --mock || true   # tiny budget: gate is *meant* to fire
          promptproof run examples/snapshots.yaml --mock        # diffs against the committed golden file
